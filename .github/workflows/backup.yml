# Backup semanal do banco do site (Cloudflare D1) para este repositório.
# Guarda contas, unidades, acessos e compras em backups/banco.sql. Senhas, sessões e links de senha
# ficam de fora de propósito. Restaurar: veja o README ("Backup e restauração").
#
# Usa o mesmo segredo da publicação (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   token da Cloudflare com permissão "D1: Edit" (o ID da conta vem do próprio token)
name: Backup do banco

on:
  schedule:
    - cron: "17 6 * * 1"   # toda segunda-feira, 03:17 no horário de Brasília
  workflow_dispatch: {}    # botão "Run workflow" para fazer um backup na hora

permissions:
  contents: write

concurrency: backup-do-banco

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      # O backup tem e-mails e valores de compras: só é gravado se o repositório for privado.
      - name: Conferir se o repositório é privado
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(gh api "repos/${{ github.repository }}" --jq .private)" != "true" ]; then
            echo "::warning::Backup não feito: o repositório é público. Deixe-o privado (Settings > Change visibility) para ativar o backup."
            echo "PULAR=1" >> "$GITHUB_ENV"; exit 0
          fi
      - name: Descobrir a conta da Cloudflare
        if: env.PULAR != '1'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          # Pega só o token do que foi colado: aceita "Bearer <token>", aspas, espaços, quebras de linha,
          # caracteres invisíveis e até o comando "curl ..." de teste que a Cloudflare mostra junto do token.
          TOKEN=$(RAW="$CLOUDFLARE_API_TOKEN" python3 -c '
          import os, re
          raw = os.environ["RAW"]
          m = re.search(r"Bearer\s+(\S+)", raw)
          tok = (m.group(1) if m else raw).strip().strip("\"\x27")
          print("".join(c for c in tok if 33 <= ord(c) < 127 and c not in "\"\x27"))')
          [ -n "$TOKEN" ] && echo "::add-mask::$TOKEN"
          R=$(curl -sS https://api.cloudflare.com/client/v4/accounts -H "Authorization: Bearer $TOKEN")
          ID=$(echo "$R" | jq -r '.result[0].id // empty')
          if [ -z "$ID" ]; then
            echo "::error::A Cloudflare recusou o token: $(echo "$R" | jq -r '[.errors[]?.message] | join("; ")')"
            # diagnóstico sem mostrar o token: só a contagem de cada tipo de caractere
            RAW="$CLOUDFLARE_API_TOKEN" python3 -c '
          import os, unicodedata
          r = os.environ["RAW"]
          c = lambda f: sum(1 for x in r if f(x))
          print("Diagnóstico:", len(r), "caracteres |", c(str.isascii) , "ASCII |",
                c(lambda x: x.isascii() and x.isalpha()), "letras |", c(str.isdigit), "dígitos |",
                c(lambda x: x in "_-"), "_ ou - |", c(lambda x: x == "."), "pontos |", c(str.isspace), "espaços/quebras |",
                c(lambda x: x in "\"\x27"), "aspas |", c(lambda x: not x.isascii()), "fora do ASCII",
                [unicodedata.name(x, "?") for x in r if not x.isascii()][:5],
                "| começa com Bearer:", r.strip().lower().startswith("bearer"), "| tem curl/http:", ("curl" in r or "http" in r))'
            exit 1
          fi
          echo "::add-mask::$ID"
          echo "CLOUDFLARE_ACCOUNT_ID=$ID" >> "$GITHUB_ENV"
          echo "CLOUDFLARE_API_TOKEN=$TOKEN" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        if: env.PULAR != '1'
      - uses: actions/setup-node@v4
        if: env.PULAR != '1'
        with:
          node-version: 22
      - name: Instalar o wrangler
        if: env.PULAR != '1'
        run: npm ci --prefix ferramentas
      - name: Exportar o banco (sem senhas)
        if: env.PULAR != '1'
        working-directory: ferramentas
        run: |
          npx wrangler d1 export compras-sou-coluna --remote -y --output ../backups/banco.sql \
            --table usuarios --table unidades --table membros --table compras
      - name: Guardar no repositório
        if: env.PULAR != '1'
        run: |
          git config user.name "backup-automatico"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backups/banco.sql
          if git diff --cached --quiet; then echo "Nada mudou desde o último backup."; exit 0; fi
          # [CI Skip] evita que a Cloudflare publique o site de novo só por causa do backup
          git commit -m "Backup do banco $(date -u +%Y-%m-%d) [CI Skip]"
          git push
