# Publica o site na Cloudflare Pages (projeto "compras-sou-coluna") a cada mudança na branch main,
# com o mesmo scripts/publicar.sh usado nas sessões do Claude (site inteiro num _worker.js).
# Precisa de um segredo no GitHub (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   token da Cloudflare com "Cloudflare Pages: Edit" e "D1: Edit"
# O ID da conta é descoberto pelo próprio token. O banco (binding DB) e a chave da franqueadora
# (CODIGO_FRANQUEADORA) ficam configurados no projeto da Cloudflare, não aqui.
name: Publicar o site

on:
  push:
    branches: [main]
    paths-ignore: ["backups/**", "**.md"]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: publicar-site
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Conferir o token da Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning::Site não publicado: falta o segredo CLOUDFLARE_API_TOKEN no GitHub (veja o README)."
            echo "PULAR=1" >> "$GITHUB_ENV"; exit 0
          fi
          # Pega só o token do que foi colado: aceita "Bearer <token>", aspas, espaços, quebras de linha,
          # caracteres invisíveis e até o comando "curl ..." de teste que a Cloudflare mostra junto do token.
          TOKEN=$(RAW="$CLOUDFLARE_API_TOKEN" python3 -c '
          import os, re
          raw = os.environ["RAW"]
          m = re.search(r"Bearer\s+(\S+)", raw)
          tok = (m.group(1) if m else raw).strip().strip("\"\x27")
          print("".join(c for c in tok if 33 <= ord(c) < 127 and c not in "\"\x27"))')
          [ -n "$TOKEN" ] && echo "::add-mask::$TOKEN"
          R=$(curl -sS https://api.cloudflare.com/client/v4/accounts -H "Authorization: Bearer $TOKEN")
          ID=$(echo "$R" | jq -r '.result[0].id // empty')
          if [ -z "$ID" ]; then
            echo "::warning::Site não publicado pelo GitHub: a Cloudflare recusou o token ($(echo "$R" | jq -r '[.errors[]?.message] | join("; ")')). Publique por scripts/publicar.sh numa sessão do Claude ou corrija o segredo CLOUDFLARE_API_TOKEN."
            # diagnóstico sem mostrar o token: só a contagem de cada tipo de caractere
            RAW="$CLOUDFLARE_API_TOKEN" python3 -c '
          import os, unicodedata
          r = os.environ["RAW"]
          c = lambda f: sum(1 for x in r if f(x))
          print("Diagnóstico:", len(r), "caracteres |", c(str.isascii) , "ASCII |",
                c(lambda x: x.isascii() and x.isalpha()), "letras |", c(str.isdigit), "dígitos |",
                c(lambda x: x in "_-"), "_ ou - |", c(lambda x: x == "."), "pontos |", c(str.isspace), "espaços/quebras |",
                c(lambda x: x in "\"\x27"), "aspas |", c(lambda x: not x.isascii()), "fora do ASCII",
                [unicodedata.name(x, "?") for x in r if not x.isascii()][:5],
                "| começa com Bearer:", r.strip().lower().startswith("bearer"), "| tem curl/http:", ("curl" in r or "http" in r))'
            echo "PULAR=1" >> "$GITHUB_ENV"; exit 0
          fi
          echo "::add-mask::$ID"
          echo "CLOUDFLARE_ACCOUNT_ID=$ID" >> "$GITHUB_ENV"
          echo "CLOUDFLARE_API_TOKEN=$TOKEN" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        if: env.PULAR != '1'
      - uses: actions/setup-node@v4
        if: env.PULAR != '1'
        with:
          node-version: 22
      - name: Instalar o wrangler
        if: env.PULAR != '1'
        run: npm ci --prefix ferramentas
      - name: Publicar na Cloudflare Pages
        if: env.PULAR != '1'
        run: bash scripts/publicar.sh
