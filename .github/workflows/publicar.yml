# Publica o site na Cloudflare Pages (projeto "compras-sou-coluna") a cada mudança na branch main.
# Precisa de um segredo no GitHub (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   token da Cloudflare com "Cloudflare Pages: Edit" e "D1: Edit"
# O ID da conta é descoberto pelo próprio token. O banco (binding DB) e a chave da franqueadora
# (CODIGO_FRANQUEADORA) ficam configurados no projeto da Cloudflare, não aqui.
name: Publicar o site

on:
  push:
    branches: [main]
    paths-ignore: ["backups/**", "**.md"]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: publicar-site
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Conferir o token da Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning::Site não publicado: falta o segredo CLOUDFLARE_API_TOKEN no GitHub (veja o README)."
            echo "PULAR=1" >> "$GITHUB_ENV"; exit 0
          fi
          # Pega só o token do que foi colado: aceita "Bearer <token>", espaços, quebras de linha
          # e até o comando "curl ..." de teste que a Cloudflare mostra junto do token.
          RAW=$CLOUDFLARE_API_TOKEN
          TOKEN=$(printf '%s' "$RAW" | grep -oE '[A-Za-z0-9_-]{30,}' | awk '{print length, $0}' | sort -rn | head -1 | cut -d' ' -f2-)
          [ -n "$TOKEN" ] && echo "::add-mask::$TOKEN"
          R=$(curl -sS https://api.cloudflare.com/client/v4/accounts -H "Authorization: Bearer $TOKEN")
          ID=$(echo "$R" | jq -r '.result[0].id // empty')
          if [ -z "$ID" ]; then
            echo "::error::A Cloudflare recusou o token: $(echo "$R" | jq -r '[.errors[]?.message] | join("; ")')"
            echo "Diagnóstico (sem mostrar o token): o segredo salvo tem ${#RAW} caracteres; o trecho com cara de token tem ${#TOKEN}."
            exit 1
          fi
          echo "::add-mask::$ID"
          echo "CLOUDFLARE_ACCOUNT_ID=$ID" >> "$GITHUB_ENV"
          echo "CLOUDFLARE_API_TOKEN=$TOKEN" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        if: env.PULAR != '1'
      - uses: actions/setup-node@v4
        if: env.PULAR != '1'
        with:
          node-version: 22
      - name: Instalar o wrangler
        if: env.PULAR != '1'
        run: npm ci --prefix ferramentas
      - name: Publicar na Cloudflare Pages
        if: env.PULAR != '1'
        run: ferramentas/node_modules/.bin/wrangler pages deploy site --project-name compras-sou-coluna --branch main --commit-dirty=true
