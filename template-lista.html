<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Lista de compras · Abertura de unidade Sou Coluna</title>
<style>
/*__FONTS__*/
@page{size:A4;margin:9mm 9mm 12mm}
:root{--coral:#EF7B60;--coral-d:#D9604A;--coral-l:#FDEEE9;--ink:#1F2328;--mut:#6B7280;--ln:#E7E2DE;--ok:#3C9A7E;--head:'Poppins',sans-serif;--body:'Inter',sans-serif}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:var(--body);color:var(--ink);font-size:8pt;line-height:1.25;-webkit-print-color-adjust:exact;print-color-adjust:exact;background:#fff}
@media screen{body{max-width:192mm;margin:8mm auto}}

/* topo */
.topo{display:flex;align-items:center;gap:6mm;background:var(--coral);color:#fff;border-radius:3mm;padding:4mm 6mm}
.topo img{height:10mm;width:auto}
.topo .t{flex:1;text-align:right}
.topo h1{font-family:var(--head);font-weight:600;font-size:15pt;margin:0;line-height:1.1}
.topo p{margin:1mm 0 0;font-size:8pt;opacity:.95}
.campos{display:grid;grid-template-columns:1.4fr 1.2fr .8fr;gap:5mm;margin:4mm 1mm 0}
.campos div{font-size:7.5pt;color:var(--mut);border-bottom:.3mm solid #B9B2AD;padding-bottom:1mm;height:7mm;display:flex;align-items:flex-end}
.resumo{display:grid;grid-template-columns:repeat(4,1fr) 1.15fr;gap:2mm;margin:4mm 0 0}
.resumo div{border:.3mm solid var(--ln);border-radius:2mm;padding:2mm 2.5mm}
.resumo small{display:block;font-size:6.5pt;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
.resumo b{display:block;font-family:var(--head);font-weight:600;font-size:10pt;margin-top:.6mm}
.resumo span{font-size:6.8pt;color:var(--mut)}
.resumo .tot{background:var(--coral-l);border-color:var(--coral-l)}
.resumo .tot b{color:var(--coral-d)}
.legenda{display:flex;flex-wrap:wrap;gap:1.5mm 5mm;align-items:center;margin:3mm 1mm 0;font-size:7pt;color:var(--mut)}
.legenda .cx{display:inline-block;width:3.2mm;height:3.2mm;border:.35mm solid #8D8580;border-radius:.6mm;vertical-align:-.6mm;margin-right:1mm}
.legenda b{color:var(--ink);font-weight:600}
.aviso{margin:2.5mm 1mm 0;font-size:7pt;color:var(--mut)}
.aviso b{color:var(--ink)}

/* etapas em duas colunas */
.etapa{margin-top:4.5mm}
.etapa-h{display:flex;align-items:baseline;gap:3mm;border-bottom:.5mm solid var(--coral);padding:0 1mm 1.2mm;margin-bottom:1.5mm;break-after:avoid}
.etapa-h .n{font-family:var(--head);font-weight:700;color:var(--coral);font-size:11pt}
.etapa-h h2{font-family:var(--head);font-weight:600;font-size:11pt;margin:0;flex:1}
.etapa-h span{font-size:7.5pt;color:var(--mut)}
.etapa-h span b{color:var(--ink);font-family:var(--head);font-weight:600;font-size:9pt}
.cols{column-count:2;column-gap:5mm;column-fill:balance}
.cat{break-inside:avoid-column;font-family:var(--head);font-weight:600;font-size:7.6pt;color:var(--coral-d);text-transform:uppercase;letter-spacing:.05em;padding:2mm 1mm .8mm;break-after:avoid}
.cat span{color:var(--mut);font-weight:500;text-transform:none;letter-spacing:0}

.it{display:grid;grid-template-columns:4mm 11mm 1fr 8mm 18mm;gap:0 1.8mm;align-items:center;padding:.9mm 1mm;border-top:.2mm solid var(--ln);break-inside:avoid}
.cat + .it{border-top:0}
.it .cx{width:4mm;height:4mm;border:.4mm solid #8D8580;border-radius:.8mm;background:#fff}
.it .fo{width:11mm;height:11mm;border-radius:1.5mm;background:#fff;border:.2mm solid var(--ln);display:flex;align-items:center;justify-content:center;overflow:hidden}
.it .fo img{width:100%;height:100%;object-fit:contain;padding:.6mm}
.it .fo.cover img{object-fit:cover;padding:0}
.it .fo.ico{background:var(--coral-l);border-color:var(--coral-l);color:var(--coral)}
.it .fo.ico svg{width:7mm;height:7mm}
.it .tx{min-width:0}
.it h3{font-family:var(--body);font-weight:600;font-size:8pt;margin:0;line-height:1.2}
.it p{margin:.3mm 0 0;font-size:6.6pt;color:var(--mut);line-height:1.22;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.it .sup{font-size:6.4pt;color:var(--coral-d);font-weight:600;-webkit-line-clamp:1}
.it .q{text-align:center;font-family:var(--head);font-weight:600;font-size:8.2pt;line-height:1.05}
.it .q small{display:block;font-family:var(--body);font-weight:400;font-size:5.8pt;color:var(--mut)}
.it .v{text-align:right;font-family:var(--head);font-weight:600;font-size:8.2pt;line-height:1.1;white-space:nowrap}
.it .v small{display:block;white-space:normal;font-family:var(--body);font-weight:400;font-size:5.8pt;color:var(--mut)}
.it .v.def{font-family:var(--body);font-weight:500;font-size:7pt;color:var(--mut)}

</style>
</head>
<body>
<!--__CONTEUDO__-->
</body>
</html>
